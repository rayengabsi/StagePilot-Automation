[project]
name = "stagepilot-automation"
version = "0.1.0"
description = "AI-powered, human-in-the-loop internship automation platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "defusedxml>=0.7.1",
    "google-genai>=1.0.0",
    "lxml>=5.0.0",
    "mcp>=2.0.0",
    "pdfplumber>=0.11.4",
    "playwright>=1.46.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "pymysql>=1.1.1",
    "rapidfuzz>=3.9.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.4",
    "reportlab>=4.2",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.32",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
]

[project.scripts]
stagepilot = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D104",
    "D107",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D102", "D103", "S324", "ARG001", "ARG002", "S106", "N817"]
"alembic/**/*.py" = ["D103", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
