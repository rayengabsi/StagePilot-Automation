# StagePilot LinkedIn MCP production configuration.
#
# This tells the LinkedInMCPConnector how to launch and talk to the real
# LinkedIn MCP server over stdio. The server is started automatically by the
# connector; there is no manual startup step.
#
# The `[gateway]` section controls the server process. `command` points at a
# Python interpreter that has the `linkedin_mcp_server` package installed and
# the server is launched as `command -m <module> --transport <transport>`.
# Relative paths are resolved against this repository. Tilde (~) is expanded.

[gateway]
# Where to find the LinkedIn MCP server. NEVER hard-code a machine-specific
# absolute path here. The default assumes `linkedin_mcp_server` is importable
# from the Python environment running StagePilot (cross-platform). Point the
# server at a different interpreter/profile by setting the environment
# variables below (they override the TOML at runtime):
#
#   LINKEDIN_MCP_COMMAND      e.g. C:/Projects/linkedin-mcp-server/.venv/Scripts/python.exe
#   LINKEDIN_MCP_CWD          e.g. C:/Projects/linkedin-mcp-server
#   LINKEDIN_MCP_MODULE
#   LINKEDIN_MCP_LOG_LEVEL
#   LINKEDIN_MCP_USER_DATA_DIR
#
command = "python"
cwd = "."
module = "linkedin_mcp_server"
transport = "stdio"
timeout_seconds = 90.0
tool_timeout_seconds = 180.0
log_level = "WARNING"

# Per-search limits and filters.
max_jobs = 8
max_pages = 3
date_posted = "past_week"
sort_by = "date"
job_type = ""
experience_level = ""

[gateway.retry]
# Recovery policy for transient MCP failures (server startup, tool-call
# timeouts, and single-job detail errors). An expired-session error is never
# retried because it is permanent until the user re-logs-in.
retry_attempts = 3          # extra attempts after the initial try
retry_delay_seconds = 2.0   # sleep before the first retry
retry_backoff = 2.0         # multiplier applied to the delay after each retry

[gateway.auth]
# Substrings that, when present in a MCP error, mean the LinkedIn session
# expired and the connector raises LinkedInSessionExpired so the caller can
# print a clear re-login instruction instead of crashing.
expired_markers = [
  "authentication",
  "relogin",
  "session expired",
  "login required",
  "unauthorized",
  "sign in",
  "not logged in",
]

# Persistent browser profile used by the real server. Empty means the server
# uses its own default (~/.linkedin-mcp/profile). Provided so the profile can
# be relocated or shared.
#
# Defaults to a dedicated tree under the user's home rather than the server's
# packed ~/.linkedin-mcp: a previously used profile root can contain
# directories owned by another account (an elevated or service context) that
# deny even the authenticated user (WinError 5) — not only the profile but the
# trace root the server writes to on *every* boot, which silently froze the
# `--login` flow before it ever opened a browser. A fresh root is always
# created and owned by the user at the next `linkedin login`.
user_data_dir = "~/.stagepilot/linkedin-mcp/profile"

# Launch the interactive login with a visible browser window so the user can
# sign in. The resulting profile is saved and reused on later runs.
login_headed = true

# Bounds for the `--status` and `--login` subprocesses. Login blocks until the
# user finishes signing in, so it tolerates a long window.
status_timeout_seconds = 300
login_timeout_seconds = 3600

# Hard deadline for the cheap, non-interactive session probe used by `doctor`
# and by the `linkedin status` / `linkedin notify` preflight so StagePilot
# never freezes on an unresponsive server. A missed deadline is reported as a
# structured "timeout" state rather than hanging.
status_probe_timeout_seconds = 20

[gateway.lifecycle]
# Automatic server lifecycle: StagePilot starts the MCP server, waits until it
# is ready, runs the job search, and shuts it down — no manual subprocesses.
startup_timeout_seconds = 90   # overall deadline to reach "ready"
shutdown_timeout_seconds = 15  # grace period before forcing the process to end
ready_poll_seconds = 2         # interval between readiness probes

# Browser bootstrap: the real server downloads the Patchright Chromium browser
# in the background on first use and politely tells every tool "setup is not
# complete yet" until it finishes. "Server started" or a basic MCP ping is NOT
# sufficient — search is usable only once the browser is installed. The
# lifecycle therefore probes a gated read-only tool and treats a bootstrap
# marker as "still warming up, keep polling" (bounded below, never a hang).
# `bootstrap_markers` are substrings of the server's own bootstrap message, and
# `probe_tool` is the tool exercised to ask the server whether it is usable.
[gateway.bootstrap]
max_wait_seconds = 900        # hard bound while waiting for browser install
poll_seconds = 5              # interval between bootstrap probes
probe_tool = "search_jobs"    # a read-only tool gated behind browser setup
markers = [
  "setup is not complete yet",
  "downloading the patchright chromium browser",
]

[notify]
# Persisted set of LinkedIn job ids that were already delivered to Telegram,
# so the same job is never notified twice. This file is gitignored and can be
# replaced by a database-backed NotificationStateRepository later.
state_file = "data/linkedin/notified.json"

max_matching_skills = 5
max_missing_skills = 5