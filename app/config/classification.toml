# Job Intelligence Layer — classification keyword dictionaries and scoring rules.
#
# Every dictionary maps a normalized classification value to the keywords that
# signal it. Keyword matching is case-insensitive and word-boundary based.
# Add new specializations / seniority levels / employment types / work modes by
# extending the relevant table; the service needs no code changes.
#
# Scoring: each keyword hit in the title is worth `title_weight`, each hit in
# the description/requirements is worth `body_weight`. The label with the
# highest total score wins. When scores tie the label listed first wins.

[scoring]
title_weight = 3.0
body_weight = 1.0
# A label must exceed this score to be assigned (otherwise the field stays None).
# Kept below `body_weight` so a single keyword hit in title or body is enough.
min_score = 0.5

